<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('ip.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body class="text-gray-900 flex flex-col min-h-screen">

    <!-- Header with Navigation -->
    <header class="bg-green-600 text-white py-4">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">Contact Us</h1>
            <nav class="mt-4">
                <a href="/template/home_page/home.html" class="mx-4 text-lg hover:text-green-300">Home</a>
                <a href="/template/about_us_page/aboutus.html" class="mx-4 text-lg hover:text-green-300">About Us</a>
                <a href="contact.html" class="mx-4 text-lg hover:text-green-300">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto flex-grow px-4 py-8 bg-white bg-opacity-80 rounded-lg shadow-lg my-8">
        <h2 class="text-2xl font-semibold mb-6 text-center">Get in Touch</h2>
        <form action="submit_form.php" method="POST" class="space-y-4">
            <div class="mb-4">
                <label for="name" class="block text-lg font-medium mb-2">Name:</label>
                <input type="text" id="name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-green-500">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-lg font-medium mb-2">Email:</label>
                <input type="email" id="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-green-500">
            </div>
            <div class="mb-4">
                <label for="message" class="block text-lg font-medium mb-2">Message:</label>
                <textarea id="message" name="message" rows="4" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-green-500"></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md shadow-sm hover:bg-green-700 focus:outline-none focus:ring focus:ring-green-500">Send Message</button>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-green-600 text-white py-4 mt-auto">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 Network Solutions. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
