<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('ip.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body class="text-gray-900 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-green-600 text-white py-4">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">IP Calculator</h1>
            <nav class="mt-4">
                <a href="home.html" class="mx-4 text-lg hover:text-green-300">Home</a>
                <a href="/template/about_us_page/aboutus.html" class="mx-4 text-lg hover:text-green-300">About Us</a>
                <a href="/template/contact_page/contact.html" class="mx-4 text-lg hover:text-green-300">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container mx-auto flex-grow px-4 py-8 bg-white bg-opacity-80 rounded-lg shadow-lg my-8">
        <h2 class="text-2xl font-semibold text-center mb-6">Calculate Your IP</h2>

        <div class="flex flex-col items-center">
            <div class="mb-4 w-full max-w-sm">
                <label for="ipAddress" class="block text-lg font-medium mb-2">IP Address:</label>
                <input type="text" id="ipAddress" name="ipAddress" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-green-500">
            </div>

            <div class="mb-4 w-full max-w-sm">
                <label for="networkMask" class="block text-lg font-medium mb-2">Network Mask:</label>
                <select id="networkMask" name="networkMask" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-green-500">
                    <option value="/0">0.0.0.0 /0</option>
                    <option value="/1">128.0.0.0 /1</option>
                    <option value="/2">192.0.0.0 /2</option>
                    <option value="/3">224.0.0.0 /3</option>
                    <option value="/4">240.0.0.0 /4</option>
                    <option value="/5">248.0.0.0 /5</option>
                    <option value="/6">252.0.0.0 /6</option>
                    <option value="/7">254.0.0.0 /7</option>
                    <option value="/8">255.0.0.0 /8</option>
                    <option value="/9">255.128.0.0 /9</option>
                    <option value="/10">255.192.0.0 /10</option>
                    <option value="/11">255.224.0.0 /11</option>
                    <option value="/12">255.240.0.0 /12</option>
                    <option value="/13">255.248.0.0 /13</option>
                    <option value="/14">255.252.0.0 /14</option>
                    <option value="/15">255.254.0.0 /15</option>
                    <option value="/16">255.255.0.0 /16</option>
                    <option value="/17">255.255.128.0 /17</option>
                    <option value="/18">255.255.192.0 /18</option>
                    <option value="/19">255.255.224.0 /19</option>
                    <option value="/20">255.255.240.0 /20</option>
                    <option value="/21">255.255.248.0 /21</option>
                    <option value="/22">255.255.252.0 /22</option>
                    <option value="/23">255.255.254.0 /23</option>
                    <option value="/24">255.255.255.0 /24</option>
                    <option value="/25">255.255.255.128 /25</option>
                    <option value="/26">255.255.255.192 /26</option>
                    <option value="/27">255.255.255.224 /27</option>
                    <option value="/28">255.255.255.240 /28</option>
                    <option value="/29">255.255.255.248 /29</option>
                    <option value="/30">255.255.255.252 /30</option>
                    <option value="/31">255.255.255.254 /31</option>
                    <option value="/32">255.255.255.255 /32</option>
                </select>
            </div>

            <button onclick="calculateNetworkDetails()" class="mt-4 px-4 py-2 bg-green-600 text-white rounded-md shadow hover:bg-green-500">
                Calculate
            </button>
        </div>

        <!-- Results Table -->
        <div class="overflow-x-auto">
            <table class="table-auto w-full bg-white border border-gray-300 rounded-md shadow-sm mt-6">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 border">Property</th>
                        <th class="px-4 py-2 border">Decimal Notation</th>
                        <th class="px-4 py-2 border">Binary Notation</th>
                    </tr>
                </thead>
                <tbody id="resultsTable">
                    <!-- Rows will be dynamically added here -->
                </tbody>
            </table>
        </div>

       <!-- Input for subnet count and calculate button -->
        <div class="flex flex-col items-center mt-6">
            <div class="w-full max-w-sm">
                <label for="subnetCount" class="block text-lg font-medium mb-2">Number of Subnets:</label>
                <input type="number" id="subnetCount" name="subnetCount" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-green-500">
            </div>

            <button onclick="calculateSubnets()" class="mt-4 px-4 py-2 bg-green-600 text-white rounded-md shadow hover:bg-green-500">
                Calculate Subnets
            </button>
        </div>

        <!-- Subnet Table -->
        <div class="overflow-x-auto mt-6">
            <table class="table-auto w-full bg-white border border-gray-300 rounded-md shadow-sm">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 border">Subnet</th>
                        <th class="px-4 py-2 border">Range</th>
                    </tr>
                </thead>
                <tbody id="subnetResultsTable">
                    <!-- Dynamically generated subnet ranges -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-green-600 text-white py-4 mt-auto">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 IP Calculator. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function calculateNetworkDetails() {
            const ip = document.getElementById("ipAddress").value;
            const mask = document.getElementById("networkMask").value;

            const ipParts = ip.split('.').map(part => parseInt(part, 10));
            const maskValue = parseInt(mask.split('/')[1], 10);
            const maskParts = (new Array(maskValue).fill(1).concat(new Array(32 - maskValue).fill(0)))
                .join('')
                .match(/.{1,8}/g)
                .map(bin => parseInt(bin, 2));

            const networkParts = ipParts.map((part, index) => part & maskParts[index]);
            const broadcastParts = networkParts.map((part, index) => part | (~maskParts[index] & 255));
            const hostMinParts = networkParts.slice();
            hostMinParts[3] += 1;
            const hostMaxParts = broadcastParts.slice();
            hostMaxParts[3] -= 1;
            const numHosts = Math.pow(2, 32 - maskValue) - 2;

            const resultsTable = document.getElementById("resultsTable");
            resultsTable.innerHTML = `
                <tr>
                    <td class="px-4 py-2 border">IP Address</td>
                    <td class="px-4 py-2 border">${ip}</td>
                    <td class="px-4 py-2 border">${ipParts.map(part => part.toString(2).padStart(8, '0')).join('.')}</td>
                </tr>
                <tr>
                    <td class="px-4 py-2 border">Mask</td>
                    <td class="px-4 py-2 border">${maskParts.join('.')} = ${maskValue}</td>
                    <td class="px-4 py-2 border">${maskParts.map(part => part.toString(2).padStart(8, '0')).join('.')}</td>
                </tr>
                <tr>
                    <td class="px-4 py-2 border">Network Address</td>
                    <td class="px-4 py-2 border">${networkParts.join('.')} /${maskValue}</td>
                    <td class="px-4 py-2 border">${networkParts.map(part => part.toString(2).padStart(8, '0')).join('.')}</td>
                </tr>
                <tr>
                    <td class="px-4 py-2 border">Broadcast</td>
                    <td class="px-4 py-2 border">${broadcastParts.join('.')}</td>
                    <td class="px-4 py-2 border">${broadcastParts.map(part => part.toString(2).padStart(8, '0')).join('.')}</td>
                </tr>
                <tr>
                    <td class="px-4 py-2 border">Host Min</td>
                    <td class="px-4 py-2 border">${hostMinParts.join('.')}</td>
                    <td class="px-4 py-2 border">${hostMinParts.map(part => part.toString(2).padStart(8, '0')).join('.')}</td>
                </tr>
                <tr>
                    <td class="px-4 py-2 border">Host Max</td>
                    <td class="px-4 py-2 border">${hostMaxParts.join('.')}</td>
                    <td class="px-4 py-2 border">${hostMaxParts.map(part => part.toString(2).padStart(8, '0')).join('.')}</td>
                </tr>
                <tr>
                    <td class="px-4 py-2 border">Hosts in Network</td>
                    <td class="px-4 py-2 border">${numHosts}</td>
                    <td class="px-4 py-2 border">Class ${getClass(maskValue)}</td>
                </tr>
            `;
        }

        function calculateSubnets() {
            const subnetCount = parseInt(document.getElementById("subnetCount").value, 10);
            const mask = document.getElementById("networkMask").value;
            const maskValue = parseInt(mask.split('/')[1], 10);

            const ip = document.getElementById("ipAddress").value;
            const ipParts = ip.split('.').map(part => parseInt(part, 10));

            const newMaskValue = maskValue + Math.ceil(Math.log2(subnetCount));
            if (newMaskValue > 32) {
                alert("Error: Too many subnets for this network class or the number of subnets is incorrect.");
                return;
            }

            const subnetSize = Math.pow(2, 32 - newMaskValue);
            const resultsTable = document.getElementById("subnetResultsTable");
            resultsTable.innerHTML = '';

            for (let i = 0; i < subnetCount; i++) {
                const subnetIpParts = ipParts.slice();
                subnetIpParts[3] += i * subnetSize;
                const subnetEndIpParts = subnetIpParts.slice();
                subnetEndIpParts[3] += subnetSize - 1;

                resultsTable.innerHTML += `
                    <tr>
                        <td class="px-4 py-2 border">Subnet ${i + 1}</td>
                        <td class="px-4 py-2 border">${subnetIpParts.join('.')} - ${subnetEndIpParts.join('.')}</td>
                    </tr>
                `;
            }
        }

        function getClass(maskValue) {
            if (maskValue <= 8) return 'A';
            if (maskValue <= 16) return 'B';
            return 'C';
        }
    </script>

</body>

</html>
